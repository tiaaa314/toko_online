<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - TOKO BAJOE</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    form, table { margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Admin Panel - TOKO BAJOE</h1>

  <form id="form-produk">
    <input type="text" id="nama" placeholder="Nama Produk" required>
    <input type="number" id="harga" placeholder="Harga" required>
    <input type="text" id="gambar" placeholder="URL Gambar" required>
    <input type="text" id="deskripsi" placeholder="Deskripsi" required>
    <button type="submit">Tambah Produk</button>
  </form>

  <h2>Daftar Produk</h2>
  <table>
    <thead>
      <tr><th>Gambar</th><th>Nama</th><th>Harga</th><th>Deskripsi</th><th>Aksi</th></tr>
    </thead>
    <tbody id="tabel-produk"></tbody>
  </table>

  <script>
    const url = "server.php";

    function muatProduk() {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("tabel-produk");
          tbody.innerHTML = "";
          data.forEach(p => {
            tbody.innerHTML += `
              <tr>
                <td><img src="${p.gambar}" width="60"></td>
                <td>${p.nama}</td>
                <td>Rp ${p.harga.toLocaleString()}</td>
                <td>${p.deskripsi}</td>
                <td><button onclick="hapusProduk(${p.id})">Hapus</button></td>
              </tr>`;
          });
        });
    }

    document.getElementById("form-produk").addEventListener("submit", e => {
      e.preventDefault();
      const produk = {
        nama: nama.value,
        harga: parseInt(harga.value),
        gambar: gambar.value,
        deskripsi: deskripsi.value
      };
      fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(produk)
      }).then(() => {
        muatProduk();
        e.target.reset();
      });
    });

    function hapusProduk(id) {
      fetch(`${url}?id=${id}`, { method: "DELETE" })
        .then(() => muatProduk());
    }

    muatProduk();
  </script>
</body>
</html>
